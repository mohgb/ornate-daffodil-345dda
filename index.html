<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060B12" />
    <link rel="icon" type="image/png" href="/img/logo/favicon.png" />

    <title>S.E.S.S — Smart Engineering &amp; Strategic Solutions</title>
    <meta
      name="description"
      content="S.E.S.S — L'ingénierie intelligente au service de vos projets. Des solutions techniques, stratégiques et durables pour un avenir plus performant."
    />

    <!-- Fonts: Poppins (display) + Inter (body). Preconnect for fast fetch, swap so text paints immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
    />

    <!-- Preload the hero photograph (LCP element). Never lazy. -->
    <link
      rel="preload"
      as="image"
      href="/img/hero/refinery-960.webp"
      imagesrcset="/img/hero/refinery-560.webp 560w, /img/hero/refinery-960.webp 960w"
      imagesizes="(max-width: 900px) 100vw, 60vw"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="S.E.S.S — Smart Engineering &amp; Strategic Solutions" />
    <meta
      property="og:description"
      content="L'ingénierie intelligente au service de vos projets."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
